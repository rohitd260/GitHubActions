# GitHub Actions with the Multi Job dependency configuration

name : "[Workflow-3] Multiple Job Configuration with the dependency"

run-name : "[Workflow-3] ${{github.actor}} developed multiple job dependency configuration"

on : 
  push : 
    paths :
      - "03-Multiple-Job-Dependency-CI-Workflow/*"
      - ".github/workflows/03-Multi-Job-Dependency-CI.yml"

jobs : 
  test : 
    name : Node JS App Test Runner
    runs-on : ubuntu-latest
    steps : 
      - uses : actions/checkout@v4

      - uses : actions/setup-node@v7
        with : 
          node-version: '24'
      
      - run : echo Node JS App Tests are running !!!
      - run : cd 03-Multiple-Job-Dependency-CI-Workflow && npm install
      - run : cd 03-Multiple-Job-Dependency-CI-Workflow && npm test

  build :  
    name : Node Js App Build Runner
    runs-on : ubuntu-latest
    needs : test
    steps :
      - uses : actions/checkout@v4

      - uses : actions/setup-node@v7
        with : 
          node-version : '24'
      
      - run : echo Node JS App Build are running !!!
      - run : cd 03-Multiple-Job-Dependency-CI-Workflow && npm install
      - run : cd 03-Multiple-Job-Dependency-CI-Workflow && npm run build

  deploy :
    name : Node Js App Deployment Runner
    runs-on : ubuntu-latest
    needs : [test,build]
    steps : 
      - uses : actions/checkout@v4
      - uses : actions/setup-node@v7
        with : 
          node-version : '24'

      - run : echo Node Js App Deployment running
      - run : cd 03-Multiple-Job-Dependency-CI-Workflow && npm install
      - run : cd 03-Multiple-Job-Dependency-CI-Workflow && npm run deploy


