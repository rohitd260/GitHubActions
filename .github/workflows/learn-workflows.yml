name : "[Example-Workflow] Learn-GitHub-Workflows"
run-name : "[Example-Workflow] ${{github.actor}} is learning GitHub actions" 

on : 
 push : 

jobs : 
  checks-bats-version : 
    runs-on : ubuntu-latest
    steps : 
      - uses : actions/checkout@v6
      - uses : actions/setup-node@v7
        with : 
          node-version : '24'
      - run : echo "Installing the Node packages"    
      - run : npm install -g bats
      - run : echo "checking the Bats version"
      - run : bats -v 